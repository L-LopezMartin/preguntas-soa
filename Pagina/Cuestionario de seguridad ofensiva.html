<!DOCTYPE html>

<html lang="es"><head><meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Cuestionario de seguridad ofensiva</title>
<link rel="icon" href="data:image/svg+xml,&lt;svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22&gt;&lt;text y=%22.9em%22 font-size=%2290%22&gt;%F0%9F%9B%A1%EF%B8%8F&lt;/text&gt;&lt;/svg&gt;">
<link rel="preconnect" href="https://fonts.googleapis.com/"><link rel="preconnect" href="https://fonts.gstatic.com/" crossorigin="">
<link href="./Cuestionario de seguridad ofensiva_files/css2" rel="stylesheet">
<style>
:root{--bg:#F4F6F9;--card:#fff;--ink:#16263A;--mut:#5B6675;--line:#D8DEE6;--ok:#1F7A6D;--okbg:#E3F4EF;--bad:#B3261E;--badbg:#FCE9E7;--acc:#2DD4BF;--s1:#1F7A6D;--s2:#2F5D9B;--s3:#8A4F9E;--s4:#B5651D}
@media(prefers-color-scheme:dark){:root{--bg:#0E1826;--card:#16263A;--ink:#EAF0F6;--mut:#9AA9BA;--line:#2A3C54;--ok:#4FD1B8;--okbg:#12362F;--bad:#FF8A80;--badbg:#3A1E22}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:Figtree,system-ui,sans-serif;line-height:1.5}
.wrap{max-width:760px;margin:0 auto;padding:20px 16px 80px}
header.hero{background:#16263A;color:#fff;padding:44px 16px 36px}
header.hero .in{max-width:760px;margin:0 auto}
.hero i{display:block;width:44px;height:7px;background:var(--acc);border-radius:2px;margin-bottom:22px}
.hero h1{font-size:clamp(30px,6vw,46px);line-height:1.08;margin:0 0 12px;font-weight:800;letter-spacing:-.02em}
.hero p{margin:0;color:#B8C4D2;max-width:46ch}
h2{font-size:17px;margin:28px 0 10px}
.blocks{display:grid;gap:8px}
.blk{display:flex;align-items:center;gap:12px;background:var(--card);border:1.5px solid var(--line);border-radius:10px;padding:12px 14px;cursor:pointer}
.blk input{accent-color:var(--c);width:18px;height:18px}
.blk b{display:block}.blk small{color:var(--mut)}.blk .bar{width:5px;align-self:stretch;background:var(--c);border-radius:3px}
.blk:has(input:checked){border-color:var(--c)}
.opts{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1.5px solid var(--line);background:var(--card);border-radius:999px;padding:8px 16px;cursor:pointer;font:inherit;color:inherit;font-weight:600}
.chip[aria-pressed=true]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.go{margin-top:28px;width:100%;border:0;background:var(--ok);color:#fff;font:inherit;font-weight:700;font-size:17px;padding:15px;border-radius:12px;cursor:pointer}
.go:disabled{opacity:.4;cursor:not-allowed}
.top{display:flex;justify-content:space-between;align-items:center;gap:12px;font-size:14px;color:var(--mut);margin-bottom:8px}
.prog{height:6px;background:var(--line);border-radius:3px;overflow:hidden;margin-bottom:22px}.prog div{height:100%;background:var(--c,var(--ok));transition:width .25s}
.tag{display:inline-block;font-size:13px;font-weight:600;color:var(--c);margin-bottom:6px}
.q{font-size:clamp(19px,3.6vw,23px);line-height:1.3;font-weight:700;margin:0 0 18px}
.o{display:flex;gap:12px;width:100%;text-align:left;background:var(--card);border:1.5px solid var(--line);border-radius:12px;padding:13px 14px;margin-bottom:9px;font:inherit;color:inherit;cursor:pointer}
.o:hover:not(:disabled){border-color:var(--ink)}
.o .l{flex:none;width:26px;height:26px;border-radius:50%;border:1.5px solid var(--line);display:grid;place-items:center;font-size:13px;font-weight:700;color:var(--mut)}
.o.ok{background:var(--okbg);border-color:var(--ok)}.o.ok .l{background:var(--ok);border-color:var(--ok);color:#fff}
.o.bad{background:var(--badbg);border-color:var(--bad)}.o.bad .l{background:var(--bad);border-color:var(--bad);color:#fff}
.o:disabled{cursor:default}
.fb{margin:14px 0;font-weight:600}
.nav{display:flex;gap:10px;margin-top:18px}.nav button{flex:1}
.btn{border:1.5px solid var(--ink);background:transparent;color:var(--ink);font:inherit;font-weight:700;padding:12px;border-radius:10px;cursor:pointer}
.btn.p{background:var(--ink);color:var(--bg)}
.score{font-size:64px;font-weight:800;line-height:1;letter-spacing:-.03em}
.rev{background:var(--card);border:1px solid var(--line);border-left:4px solid var(--bad);border-radius:10px;padding:12px 14px;margin:10px 0;font-size:15px}
.rev small{color:var(--mut);display:block;margin-top:4px}.rev .a{color:var(--ok);font-weight:600}.rev .b{color:var(--bad)}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin:18px 0}
.stats div{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px}.stats b{font-size:22px;display:block}
:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
.hide{display:none}
</style></head><body>
<header class="hero"><div class="in"><i></i><h1>Cuestionario de seguridad ofensiva</h1><p>350 preguntas de cuatro autoevaluaciones en un solo lugar. Practicá con corrección inmediata o rendí un examen.</p></div></header>
<main class="wrap" id="app"><h2>Bloques</h2><div class="blocks"><label class="blk" style="--c:var(--s1)"><span class="bar"></span><input type="checkbox" value="1" checked=""><span><b>Operación 00</b><small>Ingreso del Operador · 50 preguntas</small></span></label><label class="blk" style="--c:var(--s2)"><span class="bar"></span><input type="checkbox" value="2" checked=""><span><b>Operación 01</b><small>Planificación del pentest · 100 preguntas</small></span></label><label class="blk" style="--c:var(--s3)"><span class="bar"></span><input type="checkbox" value="3" checked=""><span><b>Pentesting a infraestructuras</b><small>Red, servicios, Wi-Fi y evidencias · 100 preguntas</small></span></label><label class="blk" style="--c:var(--s4)"><span class="bar"></span><input type="checkbox" value="4" checked=""><span><b>Reconocimiento y OSINT</b><small>Autoevaluación 02 · 100 preguntas</small></span></label></div>
 <h2>Modo</h2><div class="opts" id="mode"><button class="chip" data-v="practica" aria-pressed="true">Práctica (feedback inmediato)</button><button class="chip" data-v="examen" aria-pressed="false">Examen (nota al final)</button></div>
 <h2>Cantidad</h2><div class="opts" id="num"><button class="chip" data-v="10" aria-pressed="false">10</button><button class="chip" data-v="25" aria-pressed="true">25</button><button class="chip" data-v="50" aria-pressed="false">50</button><button class="chip" data-v="100" aria-pressed="false">100</button><button class="chip" data-v="0" aria-pressed="false">Todas</button></div>
 <h2>Repaso</h2><div class="opts"><button class="chip" id="ow" aria-pressed="false">Solo mis errores anteriores (0)</button></div>
 <button class="go" id="go">Empezar</button></main>
<script>
const Q=[{"s":1,"q":"¿Qué es un exploit en contexto académico?","o":["Un procedimiento, código o técnica que aprovecha una vulnerabilidad para demostrar una condición explotable.","Un documento legal de aceptación de reglas.","Una carpeta para guardar capturas.","Un rol dentro del SOC.","Una propiedad de confidencialidad."],"a":0},{"s":1,"q":"¿Cuál es la función principal de un SOC?","o":["Eliminar la necesidad de controles preventivos.","Publicar exploits en redes sociales.","Reemplazar al equipo de respuesta a incidentes en todo contexto.","Crear solamente contraseñas de usuarios.","Monitorear, analizar y gestionar eventos, alertas, logs e indicadores de seguridad."],"a":4},{"s":1,"q":"¿Qué debe considerarse fuera de alcance?","o":["Las evidencias documentadas por el estudiante.","Solo lo que la herramienta no puede detectar.","Únicamente equipos apagados.","Lo que pertenece al laboratorio autorizado.","Todo lo que no está expresamente incluido en la autorización."],"a":4},{"s":1,"q":"¿Cuál de las siguientes acciones está fuera de las reglas de compromiso?","o":["Registrar evidencias dentro del entorno de práctica.","Consultar a la cátedra ante una duda de alcance.","Escanear un servicio real de terceros sin autorización.","Documentar comandos ejecutados en una bitácora.","Analizar una máquina vulnerable indicada por la cátedra."],"a":2},{"s":1,"q":"¿Cuál es la finalidad del formulario obligatorio de aceptación de la Operación 00?","o":["Eliminar la necesidad de documentación técnica.","Reemplazar la responsabilidad individual por la grupal.","Permitir que los estudiantes eviten leer las reglas de compromiso.","Habilitar pruebas sobre redes públicas.","Dejar constancia individual de lectura, aceptación y compromiso con las reglas."],"a":4},{"s":1,"q":"¿Qué modo de red permite a la máquina virtual acceder a Internet usando la conexión del anfitrión?","o":["Snapshot.","Red interna sin salida externa.","NAT.","Carpeta compartida.","Payload."],"a":2},{"s":1,"q":"¿Qué diferencia el aprendizaje autorizado de una prueba no autorizada?","o":["El tipo de procesador del equipo.","El horario nocturno de ejecución.","La cantidad de estudiantes del grupo.","La existencia de laboratorio, consigna, límites y autorización.","El uso de una herramienta con interfaz gráfica."],"a":3},{"s":1,"q":"¿Qué se espera del estudiante ante un acceso no previsto o comportamiento anómalo?","o":["Continuar hasta obtener más privilegios.","Eliminar todos los registros de la práctica.","Compartir credenciales con otros grupos.","Publicarlo en redes sociales como evidencia.","Detener la actividad y comunicarlo a la cátedra."],"a":4},{"s":1,"q":"¿Qué rol cumple el Blue Team?","o":["Defender, monitorear, detectar y responder ante amenazas.","Ejecutar ataques sin límites.","Realizar únicamente diseño gráfico.","Reemplazar toda documentación por capturas.","Eliminar alertas para reducir trabajo."],"a":0},{"s":1,"q":"¿Qué es la superficie de ataque?","o":["Una lista exclusiva de puertos cerrados.","Una técnica para borrar logs.","La suma de monitores y teclados de una organización.","Un mecanismo de cifrado simétrico.","El conjunto de puntos, servicios, identidades, configuraciones o procesos que podrían ser utilizados para comprometer un activo."],"a":4},{"s":1,"q":"¿Por qué la documentación es parte central del entrenamiento ofensivo?","o":["Porque reemplaza la necesidad de comprender los resultados técnicos.","Porque solo sirve para completar formalidades administrativas.","Porque evita tener que respetar el alcance autorizado.","Porque permite reconstruir el proceso, validar hallazgos y comunicar resultados.","Porque permite ocultar errores durante la práctica."],"a":3},{"s":1,"q":"¿Cuál es el propósito principal de la Operación 00 - Ingreso del Operador?","o":["Presentar el marco inicial de trabajo, reglas, metodología y preparación del entorno.","Evaluar exclusivamente habilidades técnicas de explotación.","Asignar calificaciones finales de la materia.","Reemplazar las prácticas posteriores por una actividad introductoria.","Realizar pruebas ofensivas avanzadas sobre sistemas reales."],"a":0},{"s":1,"q":"¿Qué es un indicador de compromiso o IoC?","o":["Una garantía absoluta de que no hubo incidente.","Una licencia de virtualización.","Una señal técnica que puede sugerir actividad sospechosa o compromiso.","Una técnica para ocultar evidencia.","Un documento de aceptación del curso."],"a":2},{"s":1,"q":"¿Cuál es un uso permitido de herramientas ofensivas en la materia?","o":["Uso de credenciales filtradas de terceros.","Reconocimiento controlado sobre objetivos de laboratorio.","Escaneos masivos sobre redes públicas.","Pruebas sobre sitios reales sin permiso.","Publicación externa de resultados sensibles."],"a":1},{"s":1,"q":"En las actividades grupales, ¿qué ocurre con la responsabilidad individual?","o":["Solo aplica al estudiante que ejecuta comandos.","Se transfiere por completo a la cátedra.","No se evalúa en actividades colaborativas.","Desaparece si el grupo tiene un coordinador.","Se mantiene para cada integrante respecto de conducta, documentación y alcance."],"a":4},{"s":1,"q":"¿Qué rol cumple el Red Team?","o":["Atender soporte técnico de usuarios sin análisis de seguridad.","Gestionar calificaciones académicas.","Administrar exclusivamente backups.","Eliminar la necesidad del Blue Team.","Simular adversarios y evaluar defensas dentro de un marco autorizado."],"a":4},{"s":1,"q":"¿Qué es threat intelligence?","o":["Un informe sin contexto ni relevancia.","Un sinónimo de carpeta de evidencias.","Información recolectada, analizada y contextualizada sobre amenazas para apoyar decisiones.","Una técnica para desactivar logs.","Un tipo de adaptador de red virtual."],"a":2},{"s":1,"q":"¿Qué es un evento de seguridad?","o":["Un rol dentro del SOC.","Un hecho observable en un sistema que no necesariamente implica daño.","Un incidente confirmado con impacto irreversible.","Una vulnerabilidad crítica siempre explotada.","Una herramienta ofensiva prohibida."],"a":1},{"s":1,"q":"¿Qué es el impacto en gestión de riesgos?","o":["El proceso de instalar una máquina virtual.","Un tipo de archivo comprimido.","El permiso formal para iniciar una práctica.","La consecuencia posible o real de la materialización de un evento.","El nombre de una herramienta de enumeración."],"a":3},{"s":1,"q":"¿Cuál es un ejemplo de control preventivo?","o":["Reporte final de lecciones aprendidas.","MFA o autenticación multifactor.","Análisis forense luego del incidente.","Restauración posterior de backup.","Publicación de resultados en redes sociales."],"a":1},{"s":1,"q":"¿Qué función cumple la bitácora técnica?","o":["Evitar que el estudiante explique sus decisiones técnicas.","Publicar credenciales para que el grupo las comparta externamente.","Registrar de manera ordenada acciones, resultados, evidencias e interpretaciones.","Reemplazar el informe técnico final en todos los casos.","Guardar únicamente capturas decorativas de pantalla."],"a":2},{"s":1,"q":"¿Cuál es un ejemplo de control correctivo?","o":["Definir una política preventiva inicial.","Capacitar usuarios antes de una campaña.","Restaurar backups o revocar credenciales luego de un incidente.","Bloquear toda documentación técnica.","Instalar MFA antes de cualquier acceso."],"a":2},{"s":1,"q":"¿Qué describe mejor la ciberseguridad como proceso continuo?","o":["Una instalación única de software que resuelve todo.","Un repositorio de comandos sin interpretación.","Identificar, proteger, detectar, responder y recuperar de manera permanente.","Un examen final sin actividades prácticas.","Una práctica que no requiere revisión posterior."],"a":2},{"s":1,"q":"¿Qué diferencia a un incidente de un evento común?","o":["El incidente compromete o puede comprometer propiedades de seguridad.","El evento siempre implica delito confirmado.","El evento solo ocurre en documentos físicos.","El incidente siempre es una actualización del sistema.","El incidente nunca requiere documentación."],"a":0},{"s":1,"q":"¿Qué permite la trazabilidad en un entorno de seguridad?","o":["Modificar resultados sin dejar registro.","Evitar la necesidad de logs.","Eliminar toda evidencia del sistema.","Reconstruir qué ocurrió, cuándo y quién intervino.","Desconocer responsabilidades técnicas."],"a":3},{"s":1,"q":"¿Cuál fórmula conceptual representa mejor el riesgo según el dossier?","o":["Riesgo = antivirus instalado + teclado + monitor.","Riesgo = informe final - documentación.","Riesgo = comandos ejecutados sin alcance.","Riesgo = activo expuesto + amenaza posible + vulnerabilidad explotable + impacto esperado.","Riesgo = captura de pantalla + carpeta compartida."],"a":3},{"s":1,"q":"¿Para qué sirve un snapshot en virtualización?","o":["Ejecutar herramientas sin permisos.","Conectar laboratorios vulnerables a redes públicas.","Publicar evidencias fuera del aula.","Eliminar la necesidad de backups.","Guardar el estado de una máquina virtual para restaurarlo luego si es necesario."],"a":4},{"s":1,"q":"¿Qué función cumple un CSIRT/CERT?","o":["Reemplazar la cátedra en Moodle.","Ejecutar pruebas no autorizadas para comprobar riesgos.","Administrar solo carpetas compartidas.","Crear máquinas virtuales sin documentación.","Coordinar la respuesta ante incidentes, vulnerabilidades y comunicación asociada."],"a":4},{"s":1,"q":"¿Qué es un vector de ataque?","o":["Una herramienta exclusiva de informes.","Un checklist de virtualización.","Un sistema operativo recomendado.","Camino, mecanismo o medio usado para intentar llegar a un activo o explotar una debilidad.","Una regla de formato para Word."],"a":3},{"s":1,"q":"¿Qué significa trabajar dentro de un alcance autorizado?","o":["Ejecutar herramientas sobre cualquier sistema disponible en Internet.","Modificar sistemas institucionales sin aviso previo.","Probar contraseñas reales si el objetivo parece vulnerable.","Realizar acciones únicamente sobre objetivos, recursos y límites definidos por la cátedra.","Usar solamente herramientas gráficas y evitar terminales."],"a":3},{"s":1,"q":"¿Qué información debe tratarse con confidencialidad durante una práctica?","o":["Solo el nombre del sistema operativo.","Ninguna información generada en prácticas.","Solamente el número de página del dossier.","Únicamente el color del laboratorio.","Credenciales, evidencias, capturas, datos, configuraciones y resultados."],"a":4},{"s":1,"q":"¿Qué aporta el Purple Team?","o":["Sustituye la autorización formal de las prácticas.","Permite ejecutar pruebas fuera de alcance.","Se ocupa solo de instalar sistemas operativos.","Evita que se documenten hallazgos.","Integra Red Team y Blue Team para transformar hallazgos en mejoras defensivas."],"a":4},{"s":1,"q":"¿Qué es una vulnerabilidad?","o":["Una debilidad que puede ser explotada por una amenaza.","Una política de mejora continua ya implementada.","Una evidencia sin relación con activos.","Un equipo protegido sin exposición.","Una consecuencia económica ya materializada."],"a":0},{"s":1,"q":"¿Qué es el riesgo?","o":["Una garantía de que siempre habrá compromiso.","Un archivo de bitácora vacío.","La posibilidad de que una amenaza aproveche una vulnerabilidad y genere impacto sobre un activo.","Una técnica para clonar máquinas virtuales.","Un sinónimo exacto de herramienta ofensiva."],"a":2},{"s":1,"q":"¿Qué es el sistema operativo anfitrión?","o":["La máquina objetivo vulnerable de la práctica.","Una técnica de respuesta a incidentes.","El sistema principal instalado en el equipo del estudiante.","Un indicador de compromiso.","Un exploit usado en laboratorio."],"a":2},{"s":1,"q":"¿Cuál es una buena práctica antes de ejecutar herramientas ofensivas en un laboratorio?","o":["Usar credenciales personales para ahorrar tiempo.","Actuar primero y consultar después.","Verificar consigna, alcance, entorno y objetivo autorizado.","Conectar máquinas vulnerables a redes públicas.","Desactivar toda documentación para no revelar comandos."],"a":2},{"s":1,"q":"¿Cuál es la diferencia general entre seguridad de la información y seguridad informática?","o":["La seguridad de la información protege información en cualquier soporte; la informática se centra en sistemas tecnológicos.","La seguridad informática solo se ocupa de personas y procesos manuales.","La seguridad de la información protege solo redes; la informática solo documentos físicos.","Ambas significan exactamente lo mismo en todos los contextos profesionales.","La seguridad de la información no contempla confidencialidad."],"a":0},{"s":1,"q":"¿Qué es un payload?","o":["Una pregunta del formulario de aceptación.","La acción o carga que se ejecuta como resultado de una explotación.","Un tipo de usuario de Moodle.","Un método para redactar informes ejecutivos.","Una tabla de requisitos técnicos."],"a":1},{"s":1,"q":"En la materia Seguridad Ofensiva Avanzada, ¿cómo debe entenderse el rol del estudiante?","o":["Como un observador externo sin participación técnica.","Como un usuario pasivo de herramientas automatizadas.","Como un atacante libre de elegir cualquier objetivo.","Como un administrador sin responsabilidades sobre evidencias.","Como un operador en formación que analiza, documenta y comunica resultados."],"a":4},{"s":1,"q":"¿Qué propiedad de seguridad se afecta principalmente ante una filtración de credenciales?","o":["Estética visual.","Ergonomía.","Confidencialidad.","Capacidad eléctrica.","Disponibilidad."],"a":2},{"s":1,"q":"¿Qué condición hace profesional a una técnica ofensiva?","o":["Uso de herramientas sin comprenderlas.","Ausencia de límites operativos.","Autorización, alcance definido, finalidad legítima, documentación y control del impacto.","Velocidad de ejecución sin registro.","Acceso a cualquier sistema disponible."],"a":2},{"s":1,"q":"¿Qué propiedad se ve afectada si un servicio deja de estar accesible cuando se lo necesita?","o":["Autenticidad.","Normalización lingüística.","Trazabilidad documental externa.","Disponibilidad.","Colorimetría."],"a":3},{"s":1,"q":"¿Cuál es una diferencia entre pentest y Red Team?","o":["El Red Team nunca documenta evidencias.","El pentest solo se aplica a documentos impresos.","Ambos son idénticos y no requieren alcance.","El pentest suele ser más técnico y delimitado; Red Team evalúa defensas frente a adversarios simulados con objetivos más amplios.","El Red Team no necesita autorización."],"a":3},{"s":1,"q":"¿Cuál es un ejemplo de control detectivo?","o":["Desactivar el SIEM.","Compartir contraseñas entre grupos.","Monitoreo de logs y alertas.","Evitar registros de auditoría.","Eliminar toda evidencia."],"a":2},{"s":1,"q":"¿Cuál es la finalidad de preparar el laboratorio antes de iniciar prácticas?","o":["Contar con un entorno funcional, seguro, ordenado, documentado y reproducible.","Usar herramientas sin verificar conectividad.","Ejecutar pruebas sobre sistemas reales sin autorización.","Evitar crear bitácoras.","Mezclar datos personales con evidencias de laboratorio."],"a":0},{"s":1,"q":"¿Qué es una amenaza?","o":["Una medida destinada a reducir exposición.","Un informe final de laboratorio.","Una carpeta de evidencias.","Una situación, actor o evento con capacidad de causar daño.","Un recurso que tiene valor para la organización."],"a":3},{"s":1,"q":"¿Por qué la superficie de ataque no se limita a puertos abiertos?","o":["Porque los puertos abiertos no existen en redes modernas.","Porque únicamente depende del sistema operativo anfitrión.","Porque solo importan los cables físicos.","Porque también incluye identidades, configuraciones, aplicaciones, procesos humanos y datos expuestos.","Porque se mide solamente por cantidad de usuarios administrativos."],"a":3},{"s":1,"q":"¿Qué protege la ciberseguridad?","o":["Únicamente documentos impresos.","Exclusivamente programas antivirus.","Datos, sistemas, identidades, servicios, procesos e infraestructura digital.","Solo computadoras personales sin conexión.","Solo el equipamiento físico de una sala técnica."],"a":2},{"s":1,"q":"¿Cuál de las siguientes opciones representa un activo digital?","o":["Una base de datos de alumnos.","Un horario impreso sin datos relevantes.","Una opinión sin relación con sistemas.","Una silla del aula sin valor tecnológico.","Un cable desconectado sin función."],"a":0},{"s":1,"q":"¿Qué propiedad se relaciona con mantener la información completa y sin alteraciones no autorizadas?","o":["Integridad.","Portabilidad física.","Confidencialidad.","Comodidad.","Disponibilidad."],"a":0},{"s":2,"q":"¿Cuál es la principal función del monitoreo defensivo durante una prueba de penetración?","o":["Desactivar controles que interfieran con la prueba","Observar, interpretar y responder a la actividad ofensiva controlada","Generar la mayor cantidad posible de alertas","Evitar que el equipo ofensivo documente sus acciones","Sustituir la autorización formal del pentest"],"a":1},{"s":2,"q":"¿Qué se entiende por evento en un entorno de monitoreo?","o":["Un conjunto de reglas de correlación","Un registro individual generado por un sistema","Una acción de respuesta automática","Un incidente confirmado","Una investigación completa realizada por el SOC"],"a":1},{"s":2,"q":"¿Qué diferencia principal existe entre un evento y una alerta?","o":["El evento siempre requiere respuesta inmediata","El evento solo se genera en un SIEM","La alerta surge cuando una condición requiere revisión","La alerta no necesita evidencia","El evento siempre representa un ataque y la alerta no"],"a":2},{"s":2,"q":"¿Cuál de las siguientes opciones describe mejor la telemetría?","o":["Una política de seguridad organizacional","Una autorización contractual","Datos técnicos útiles para observar el comportamiento de sistemas y usuarios","Una lista de vulnerabilidades sin contexto","Un informe ejecutivo del pentest"],"a":2},{"s":2,"q":"¿Cuál es la secuencia correcta de la cadena defensiva?","o":["Actividad → Alerta → Evento → Respuesta → Log","Actividad → Log → Evento → Investigación → Correlación","Log → Activ  app.innerHTML=`<h2 style="margin-top:8px">Resultado</h2><div class="score">${pc}%</div><p>${ok} de ${r.qs.length} correctas</p>
 <div class="stats">${[1,2,3,4].filter(k=>r.qs.some(x=>x.q.s==k)).map(k=>{const a=r.qs.filter(x=>x.q.s==k);return `<div style="border-left:4px solid ${SEC[k][2]}"><b>${a.filter(x=>x.pick==x.q.a).length}/${a.length}</b>${SEC[k][0]}</div>`}).join('')}</div>
 ${bad.length?`<h2>Para repasar (${bad.length})</h2>${bad.map(x=>`<div class="rev"><b>${esc(x.q.q)}</b><small class="b">Tu respuesta: ${esc(x.q.o[x.pick])}</small><small class="a">Correcta: ${esc(x.q.o[x.q.a])}</small></div>`).join('')}`:'<p><b>Sin errores. Muy bien.</b></p>'}
 <div class="nav"><button class="btn" id="h">Inicio</button><button class="btn p" id="again">Repetir</button></div>`;
 $('#h').onclick=home;$('#again').onclick=start;window.scrollTo(0,0);
}
home();
</script>
